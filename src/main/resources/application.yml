spring:
  application:
    name: warehouse-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/geli_warehouse}
    username: ${DATABASE_USERNAME:geli}
    password: ${DATABASE_PASSWORD:geli_local}
    hikari:
      maximum-pool-size: 12
      connection-timeout: 10000
      connection-init-sql: SET lock_timeout = '5s'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-trailing-tokens: true
      accept-float-as-int: false
      fail-on-null-for-primitives: true
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    max-http-form-post-size: 1MB
