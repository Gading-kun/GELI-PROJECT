services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: geli_warehouse
      POSTGRES_USER: geli
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-geli_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
